[project]
name = "agentic-ai-learning"
version = "0.1.0"
description = "Agentic AI Learning: LangChain, LangGraph, RAG, and Autonomous Agents"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "ipykernel>=7.4.0",
    "langchain>=1.4.7",
    "langchain-community>=0.4.2",
    "langchain-google-genai>=4.4.2",
    "langchain-groq>=1.1.3",
    "langchain-openai>=1.7.2",
    "pypdf>=6.21.2",
    "python-dotenv>=1.2.4",
]

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"
